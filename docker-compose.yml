version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./compensation_equity.db
      - RANDOM_SEED=20261022
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
